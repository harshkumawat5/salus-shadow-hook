[project]
name = "salus-shadow-hook"
version = "0.1.0"
description = "Shadow-mode Claude Code PreToolUse hook with five safety policies, plus a SWE-agent trajectory replay"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # the hook is stdlib-only so it can be dropped into any .claude/hooks/

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
